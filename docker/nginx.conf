# CRYPTO MINING GAME — nginx para el frontend (SPA React + Vite)
# Sirve el build estático de /usr/share/nginx/html.
# Todas las rutas que no son un archivo sirven index.html (React Router).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos con caché larga (tienen hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin caché para index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store";
    }
}
